name: "CodeQL"

on:
  pull_request:
  schedule:
    - cron: '42 4 * * 3' # Every Wednesday at 4:42am

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: 'ubuntu-latest'
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: go
          build-mode: manual
        - language: javascript-typescript
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      name: Set up Go
      if: matrix.build-mode == 'manual' && matrix.language == 'go'
      with:
        go-version: stable
        cache: true
        cache-dependency-path: backend/go.sum

    - name: Initialize CodeQL
      uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-and-quality

    - name: Build Go code
      working-directory: ./backend
      if: matrix.build-mode == 'manual' && matrix.language == 'go'
      run: go build -o bin/hub ./cmd/hub && go build -o bin/agent ./cmd/agent
      env:
        CGO_ENABLED: 1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        category: "/language:${{matrix.language}}"
