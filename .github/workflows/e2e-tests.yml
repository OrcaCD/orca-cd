name: E2E Tests

on:
  push:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ./frontend/package.json

      - name: Use Node.js 26.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: "pnpm"
          cache-dependency-path: ./e2e/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm i --frozen-lockfile
        working-directory: ./e2e

      - name: Run Linter
        run: node --run lint
        working-directory: ./e2e

      - name: Check Formatting
        run: node --run format:check
        working-directory: ./e2e

      - name: Type Checking
        run: node --run typecheck
        working-directory: ./e2e

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ./e2e

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build E2E images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: ./e2e
          files: docker-compose.e2e.yml
          targets: |
            hub
            agent
          load: true
          set: |
            hub.cache-from=type=gha,scope=e2e-hub
            hub.cache-to=type=gha,scope=e2e-hub
            agent.cache-from=type=gha,scope=e2e-agent
            agent.cache-to=type=gha,scope=e2e-agent

      - name: Run E2E tests
        run: node --run test
        working-directory: ./e2e
        env:
          E2E_SKIP_BUILD: "1"

      - name: Upload Playwright Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ./e2e/playwright-report
          retention-days: 30
