name: CI

on:
  push:

permissions:
  contents: read
  pull-requests: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout code
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: ./frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "25.x.x"
          cache: "pnpm"
          cache-dependency-path: ./frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm i --frozen-lockfile

      - name: Run Linter
        working-directory: ./frontend
        run: node --run lint

      - name: Check Formatting
        working-directory: ./frontend
        run: node --run format:check

      - name: Build
        working-directory: ./frontend
        run: node --run build

      - name: Type Checking
        working-directory: ./frontend
        run: node --run typecheck

      - name: Check translations
        working-directory: ./frontend
        run: node --run translations:check

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      id-token: write # For Codecov upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout code
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        name: Set up Go
        with:
          go-version: stable
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install Buf CLI
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true
          version: 1.66.1

      - name: Verify Protobufs
        working-directory: ./backend
        run: |
          buf build --error-format=github-actions
          buf lint --error-format github-actions
          buf format --diff --error-format github-actions --exit-code

      - name: Compile Protobufs
        working-directory: ./backend
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          buf generate
          if [[ -n "$(git status --porcelain --untracked-files=all -- internal/proto)" ]]; then
            echo "Generated protobuf files are out of date. Run 'buf generate' and commit the changes."
            git --no-pager diff -- internal/proto
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11
          working-directory: ./backend

      - name: Install gotestsum
        working-directory: ./backend
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Verify dependencies
        working-directory: ./backend
        run: go mod verify

      - name: Build
        working-directory: ./backend
        run: go build -v ./...

      - name: Run Tests
        working-directory: ./backend
        run: gotestsum -- -failfast -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          fail_ci_if_error: true

