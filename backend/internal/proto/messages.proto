syntax = "proto3";

package messages;

option go_package = "./messages";

message ClientMessage {
  oneof payload {
    PongResponse pong = 1;
    KeyExchangeResponse key_exchange_response = 2;
    EncryptedPayload encrypted_payload = 3;
    DeployResult deploy_result = 4;
    PullImagesResult pull_images_result = 5;
    DeleteResult delete_result = 6;
    ApplicationStatusReport application_status_report = 7;
    AgentInfo agent_info = 8;
    EnvListResult env_list_result = 9;
    EnvUpdateResult env_update_result = 10;
    ImageUpdatesReport image_updates_report = 11;
  }
}

message ServerMessage {
  oneof payload {
    PingRequest ping = 1;
    KeyExchangeInit key_exchange_init = 2;
    EncryptedPayload encrypted_payload = 3;
    DeployRequest deploy_request = 4;
    AgentSettings agent_settings = 5;
    PullImagesRequest pull_images_request = 6;
    DeleteRequest delete_request = 7;
    EnvListRequest env_list_request = 8;
    EnvUpdateRequest env_update_request = 9;
  }
}

message PingRequest {
  int64 timestamp = 1;
}

message PongResponse {
  int64 timestamp = 1;
}

message KeyExchangeInit {
  bytes mlkem_encapsulation_key = 1;
  bytes x25519_public_key = 2;
  bytes hub_signature = 3;
}

message KeyExchangeResponse {
  bytes mlkem_ciphertext = 1;
  bytes agent_x25519_public_key = 2;
  bytes agent_signature = 3;
}

message EncryptedPayload {
  bytes nonce = 1;
  bytes ciphertext = 2;
}

message DeployRequest {
  string request_id = 1;
  string application_id = 2;
  string application_name = 3;
  string compose_file = 4;
  bool delete_old_images = 5;
  // Images to run instead of the ones the compose file names, so a rollback
  // runs the exact images of an earlier deployment.
  repeated ServiceImage pinned_images = 6;
  ImageRetention image_retention = 7;
}

// ImageRetention adjusts which old images are deleted for an application that
// can be rolled back. Unset, the images replaced by an update are deleted.
message ImageRetention {
  // Images of the deployment a rollback would restore. They are kept.
  repeated string keep_image_ids = 1;
  // Images of earlier deployments that were kept before. They are deleted
  // too, unless a container still uses them.
  repeated string remove_image_ids = 2;
}

// ServiceImage is the image the containers of a compose service run.
message ServiceImage {
  string service = 1;
  // Local image ID (sha256:…).
  string image_id = 2;
  // Registry reference pinned by digest (repo@sha256:…). Empty for images that
  // did not come from a registry, e.g. built locally.
  string pinned_ref = 3;
}

message DeleteRequest {
  string request_id = 1;
  string application_id = 2;
  string application_name = 3;
}

message DeleteResult {
  string request_id = 1;
  string application_id = 2;
  bool success = 3;
  string error_message = 4;
}

message DeployResult {
  string request_id = 1;
  string application_id = 2;
  bool success = 3;
  string error_message = 4;
  // Images the services run after a successful deployment.
  repeated ServiceImage images = 5;
}

message AgentSettings {
  repeated ImagePollSettings image_poll_settings = 1;
}

message ImagePollSettings {
  string application_id = 1;
  bool enabled = 2;
  int64 interval_seconds = 3;
  bool delete_old_images = 4;
  string application_name = 5;
  ImageRetention image_retention = 6;
  ReleaseAgePolicy release_age = 7;
}

// ReleaseAgePolicy holds back updated images until their registry push time is
// older than minimum_seconds. 0 disables it.
message ReleaseAgePolicy {
  int64 minimum_seconds = 1;
  // Registries whose images skip the check.
  repeated string allowed_registries = 2;
  // Overrides minimum_seconds per compose service.
  map<string, int64> service_minimum_seconds = 3;
}

message PullImagesRequest {
  string request_id = 1;
  string application_id = 2;
  string application_name = 3;
  bool delete_old_images = 4;
  ImageRetention image_retention = 5;
  ReleaseAgePolicy release_age = 6;
  // Images an image pull webhook announced. With a release age, only these
  // are updated, and without the age check.
  repeated string webhook_images = 7;
}

message PullImagesResult {
  string request_id = 1;
  string application_id = 2;
  bool success = 3;
  bool images_updated = 4;
  string error_message = 5;
  // Images the services run after a successful update.
  repeated ServiceImage images = 6;
  // Set when new images were pulled but recreating the containers failed,
  // which leaves the application in an unknown state.
  bool redeploy_failed = 7;
  // Updates held back by the release age policy.
  repeated HeldBackImage held_back_images = 8;
}

message HeldBackImage {
  string image = 1;
  string reason = 2;
}

enum ImageUpdateStatus {
  IMAGE_UPDATE_STATUS_UNSPECIFIED = 0;
  IMAGE_UPDATE_STATUS_UP_TO_DATE = 1;
  // A new image waits for the minimum release age.
  IMAGE_UPDATE_STATUS_WAITING = 2;
  // A new image is held back until the configuration is fixed.
  IMAGE_UPDATE_STATUS_BLOCKED = 3;
  IMAGE_UPDATE_STATUS_UPDATED = 4;
  // Not checked by this run, e.g. not announced by an image pull webhook.
  IMAGE_UPDATE_STATUS_SKIPPED = 5;
  IMAGE_UPDATE_STATUS_FAILED = 6;
}

// ImageUpdate is the update state of the image of one compose service.
message ImageUpdate {
  string service = 1;
  string image = 2;
  ImageUpdateStatus status = 3;
  string current_digest = 4;
  // From the org.opencontainers.image.version label, if the image has one.
  string current_version = 5;
  string new_digest = 6;
  string new_version = 7;
  // Unix seconds, 0 if unknown.
  int64 pushed_at = 8;
  // pushed_at is when the agent first saw the digest, as the registry has no push time.
  bool first_seen = 9;
  int64 eligible_at = 10;
  int64 minimum_age_seconds = 11;
  bool minimum_age_from_label = 12;
  string reason = 13;
}

// ImageUpdatesReport is sent after every image check.
message ImageUpdatesReport {
  string application_id = 1;
  int64 checked_at = 2;
  repeated ImageUpdate images = 3;
}

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_HEALTHY = 1;
  HEALTH_STATUS_UNHEALTHY = 2;
  HEALTH_STATUS_STOPPED = 3;
}

message ServiceStatus {
  string name = 1;
  HealthStatus health = 2;
}

message ApplicationStatus {
  string application_id = 1;
  // Aggregate health of all containers. A mix of healthy and failing services
  // is reported as unhealthy; the hub derives the degraded state from services.
  HealthStatus health = 2;
  // Health per compose service, sorted by name. Empty for agents that predate
  // per-service reporting.
  repeated ServiceStatus services = 3;
}

// ApplicationStatusReport carries the health of every application managed by an
// agent in a single message, sent right after the agent connects.
message ApplicationStatusReport {
  repeated ApplicationStatus statuses = 1;
}

message AgentInfo {
  string version = 1;
  string docker_version = 2;
  bool docker_unreachable = 3;
}

message EnvListRequest {
  string request_id = 1;
  string application_id = 2;
  string application_name = 3;
}

message EnvEntry {
  string key = 1;
  bool is_secret = 2;
  string value = 3;
  bool is_set = 4;
}

message EnvFile {
  string path = 1;
  repeated string services = 2;
  repeated EnvEntry entries = 3;
  string revision = 4;
}

message EnvListResult {
  string request_id = 1;
  string application_id = 2;
  bool success = 3;
  string error_message = 4;
  repeated EnvFile env_files = 5;
}

message EnvChange {
  string key = 1;
  bool delete = 2;
  string value = 3;
  bool is_secret = 4;
}

message EnvFileChanges {
  string path = 1;
  repeated EnvChange changes = 2;
  string expected_revision = 3;
}

message EnvUpdateRequest {
  string request_id = 1;
  string application_id = 2;
  string application_name = 3;
  repeated EnvFileChanges files = 4;
}

message EnvUpdateResult {
  string request_id = 1;
  string application_id = 2;
  bool success = 3;
  string error_message = 4;
  bool conflict = 5;
}
