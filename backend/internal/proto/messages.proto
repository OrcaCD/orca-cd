syntax = "proto3";

package messages;

import "google/protobuf/timestamp.proto";

option go_package = "./messages";

message ClientMessage {
  oneof payload {
    PongResponse pong = 1;
    KeyExchangeResponse key_exchange_response = 2;
    EncryptedPayload encrypted_payload = 3;
    DeployResult deploy_result = 4;
    PullImagesResult pull_images_result = 5;
    DeleteResult delete_result = 6;
    ApplicationStatusReport application_status_report = 7;
    AgentInfo agent_info = 8;
    EnvListResult env_list_result = 9;
    EnvUpdateResult env_update_result = 10;
    ImageUpdatesReport image_updates_report = 11;
    ContainerListResult container_list_result = 12;
    ContainerInspectResult container_inspect_result = 13;
    ContainerLogsChunk container_logs_chunk = 14;
    ContainerStatsSample container_stats_sample = 15;
    StreamEnd stream_end = 16;
    StreamStarted stream_started = 17;
  }
}

message ServerMessage {
  oneof payload {
    PingRequest ping = 1;
    KeyExchangeInit key_exchange_init = 2;
    EncryptedPayload encrypted_payload = 3;
    DeployRequest deploy_request = 4;
    AgentSettings agent_settings = 5;
    PullImagesRequest pull_images_request = 6;
    DeleteRequest delete_request = 7;
    EnvListRequest env_list_request = 8;
    EnvUpdateRequest env_update_request = 9;
    ContainerListRequest container_list_request = 10;
    ContainerInspectRequest container_inspect_request = 11;
    ContainerLogsRequest container_logs_request = 12;
    ContainerStatsRequest container_stats_request = 13;
    StreamCancel stream_cancel = 14;
    StreamKeepAlive stream_keep_alive = 15;
  }
}

message PingRequest {
  int64 timestamp = 1;
}

message PongResponse {
  int64 timestamp = 1;
}

message KeyExchangeInit {
  bytes mlkem_encapsulation_key = 1;
  bytes x25519_public_key = 2;
  bytes hub_signature = 3;
}

message KeyExchangeResponse {
  bytes mlkem_ciphertext = 1;
  bytes agent_x25519_public_key = 2;
  bytes agent_signature = 3;
}

message EncryptedPayload {
  bytes nonce = 1;
  bytes ciphertext = 2;
}

message DeployRequest {
  string request_id = 1;
  string application_id = 2;
  string application_name = 3;
  string compose_file = 4;
  bool delete_old_images = 5;
  // Images to run instead of the ones the compose file names, so a rollback
  // runs the exact images of an earlier deployment.
  repeated ServiceImage pinned_images = 6;
  ImageRetention image_retention = 7;
}

// ImageRetention adjusts which old images are deleted for an application that
// can be rolled back. Unset, the images replaced by an update are deleted.
message ImageRetention {
  // Images of the deployment a rollback would restore. They are kept.
  repeated string keep_image_ids = 1;
  // Images of earlier deployments that were kept before. They are deleted
  // too, unless a container still uses them.
  repeated string remove_image_ids = 2;
}

// ServiceImage is the image the containers of a compose service run.
message ServiceImage {
  string service = 1;
  // Local image ID (sha256:…).
  string image_id = 2;
  // Registry reference pinned by digest (repo@sha256:…). Empty for images that
  // did not come from a registry, e.g. built locally.
  string pinned_ref = 3;
}

message DeleteRequest {
  string request_id = 1;
  string application_id = 2;
  string application_name = 3;
}

message DeleteResult {
  string request_id = 1;
  string application_id = 2;
  bool success = 3;
  string error_message = 4;
}

message DeployResult {
  string request_id = 1;
  string application_id = 2;
  bool success = 3;
  string error_message = 4;
  // Images the services run after a successful deployment.
  repeated ServiceImage images = 5;
  repeated ComposeWarning warnings = 6;
  string compose_file_sha256 = 7;
}

message ComposeWarning {
  string code = 1;
  string service = 2;
  string field = 3;
}

message AgentSettings {
  repeated ImagePollSettings image_poll_settings = 1;
}

message ImagePollSettings {
  string application_id = 1;
  bool enabled = 2;
  int64 interval_seconds = 3;
  bool delete_old_images = 4;
  string application_name = 5;
  ImageRetention image_retention = 6;
  ReleaseAgePolicy release_age = 7;
}

// ReleaseAgePolicy holds back updated images until their registry push time is
// older than minimum_seconds. 0 disables it.
message ReleaseAgePolicy {
  int64 minimum_seconds = 1;
  // Registries whose images skip the check.
  repeated string allowed_registries = 2;
  // Overrides minimum_seconds per compose service.
  map<string, int64> service_minimum_seconds = 3;
  // The least age of every image, which neither labels, service overrides nor
  // allowed_registries lower. Only enforced_exempt_registries skip it.
  int64 enforced_minimum_seconds = 4;
  repeated string enforced_exempt_registries = 5;
}

message PullImagesRequest {
  string request_id = 1;
  string application_id = 2;
  string application_name = 3;
  bool delete_old_images = 4;
  ImageRetention image_retention = 5;
  ReleaseAgePolicy release_age = 6;
  // Limits the pull to these images, e.g. the ones an image pull webhook
  // announced. They still wait for the release age.
  repeated string webhook_images = 7;
}

message PullImagesResult {
  string request_id = 1;
  string application_id = 2;
  bool success = 3;
  bool images_updated = 4;
  string error_message = 5;
  // Images the services run after a successful update.
  repeated ServiceImage images = 6;
  // Set when new images were pulled but recreating the containers failed,
  // which leaves the application in an unknown state.
  bool redeploy_failed = 7;
  // Updates held back by the release age policy.
  repeated HeldBackImage held_back_images = 8;
}

message HeldBackImage {
  string image = 1;
  string reason = 2;
}

enum ImageUpdateStatus {
  IMAGE_UPDATE_STATUS_UNSPECIFIED = 0;
  IMAGE_UPDATE_STATUS_UP_TO_DATE = 1;
  // A new image waits for the minimum release age.
  IMAGE_UPDATE_STATUS_WAITING = 2;
  // A new image is held back until the configuration is fixed.
  IMAGE_UPDATE_STATUS_BLOCKED = 3;
  IMAGE_UPDATE_STATUS_UPDATED = 4;
  // Not checked by this run, e.g. not announced by an image pull webhook.
  IMAGE_UPDATE_STATUS_SKIPPED = 5;
  IMAGE_UPDATE_STATUS_FAILED = 6;
}

// ImageUpdate is the update state of the image of one compose service.
message ImageUpdate {
  string service = 1;
  string image = 2;
  ImageUpdateStatus status = 3;
  string current_digest = 4;
  // From the org.opencontainers.image.version label, if the image has one.
  string current_version = 5;
  string new_digest = 6;
  string new_version = 7;
  // Unix seconds, 0 if unknown.
  int64 pushed_at = 8;
  // pushed_at is when the agent first saw the digest, as the registry has no push time.
  bool first_seen = 9;
  int64 eligible_at = 10;
  int64 minimum_age_seconds = 11;
  // minimum_age_from_label was set by the removed orca-cd.minimum-release-age label.
  reserved 12;
  reserved "minimum_age_from_label";
  string reason = 13;
  // The enforced minimum raised minimum_age_seconds.
  bool minimum_age_enforced = 14;
}

// ImageUpdatesReport is sent after every image check.
message ImageUpdatesReport {
  string application_id = 1;
  int64 checked_at = 2;
  repeated ImageUpdate images = 3;
}

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_HEALTHY = 1;
  HEALTH_STATUS_UNHEALTHY = 2;
  HEALTH_STATUS_STOPPED = 3;
}

message ServiceStatus {
  string name = 1;
  HealthStatus health = 2;
}

message ApplicationStatus {
  string application_id = 1;
  // Aggregate health of all containers. A mix of healthy and failing services
  // is reported as unhealthy; the hub derives the degraded state from services.
  HealthStatus health = 2;
  // Health per compose service, sorted by name. Empty for agents that predate
  // per-service reporting.
  repeated ServiceStatus services = 3;
}

// ApplicationStatusReport carries the health of every application managed by an
// agent in a single message, sent right after the agent connects.
message ApplicationStatusReport {
  repeated ApplicationStatus statuses = 1;
}

message AgentInfo {
  string version = 1;
  string docker_version = 2;
  bool docker_unreachable = 3;
  // Supported features, e.g. "container-monitoring".
  repeated string capabilities = 4;
}

message EnvListRequest {
  string request_id = 1;
  string application_id = 2;
  string application_name = 3;
}

message EnvEntry {
  string key = 1;
  bool is_secret = 2;
  string value = 3;
  bool is_set = 4;
}

message EnvFile {
  string path = 1;
  repeated string services = 2;
  repeated EnvEntry entries = 3;
  string revision = 4;
}

message EnvListResult {
  string request_id = 1;
  string application_id = 2;
  bool success = 3;
  string error_message = 4;
  repeated EnvFile env_files = 5;
}

message EnvChange {
  string key = 1;
  bool delete = 2;
  string value = 3;
  bool is_secret = 4;
}

message EnvFileChanges {
  string path = 1;
  repeated EnvChange changes = 2;
  string expected_revision = 3;
}

message EnvUpdateRequest {
  string request_id = 1;
  string application_id = 2;
  string application_name = 3;
  repeated EnvFileChanges files = 4;
}

message EnvUpdateResult {
  string request_id = 1;
  string application_id = 2;
  bool success = 3;
  string error_message = 4;
  bool conflict = 5;
}

message ContainerListRequest {
  string request_id = 1;
  string application_id = 2;
}

message PortBinding {
  string ip = 1;
  // Zero when not published.
  uint32 public_port = 2;
  uint32 private_port = 3;
  string protocol = 4;
}

message NetworkInfo {
  string name = 1;
  string ip_address = 2;
  repeated string aliases = 3;
}

message MountInfo {
  string type = 1;
  string name = 2;
  string destination = 3;
  bool read_only = 4;
}

message ContainerInfo {
  string id = 1;
  string name = 2;
  string service = 3;
  string state = 4;
  HealthStatus health = 5;
  string health_raw = 6;
  string image = 7;
  string image_id = 8;
  // Empty for images that did not come from a registry.
  string image_digest = 9;
  int32 restart_count = 10;
  int32 exit_code = 11;
  int64 created_at_ms = 12;
  // Zero when unset.
  int64 started_at_ms = 13;
  int64 finished_at_ms = 14;
  repeated PortBinding ports = 15;
  repeated NetworkInfo networks = 16;
  repeated MountInfo mounts = 17;
  // Compose replica number, 0 when unknown.
  int32 container_number = 18;
  bool oom_killed = 19;
  // Why the container could not start, from the Docker state.
  string error = 20;
  string restart_policy = 21;
  string log_driver = 22;
  int32 health_failing_streak = 23;
  double cpu_limit = 24;
}

message ContainerListResult {
  string request_id = 1;
  string application_id = 2;
  bool success = 3;
  string error_message = 4;
  repeated ContainerInfo containers = 5;
}

message ContainerInspectRequest {
  string request_id = 1;
  string application_id = 2;
  string container_id = 3;
}

message ContainerInspectResult {
  string request_id = 1;
  string application_id = 2;
  bool success = 3;
  string error_message = 4;
  // Sanitized by the agent: no environment variables, secrets redacted.
  string inspect_json = 5;
}

message ContainerLogsRequest {
  string request_id = 1;
  string application_id = 2;
  string container_id = 3;
  // -1 for all lines, 0 for none.
  int32 tail = 4;
  int64 since_unix_ms = 5;
  bool follow = 6;
  // Cap for non-follow reads, 0 for the agent default. It cuts off the newest
  // lines, use tail or since to read the end of a large log.
  int64 max_bytes = 7;
}

message ContainerStatsRequest {
  string request_id = 1;
  string application_id = 2;
  string container_id = 3;
}

message StreamStarted {
  string request_id = 1;
}

message StreamCancel {
  string request_id = 1;
}

message StreamKeepAlive {
  string request_id = 1;
}

enum LogStream {
  LOG_STREAM_UNSPECIFIED = 0;
  LOG_STREAM_STDOUT = 1;
  LOG_STREAM_STDERR = 2;
}

message LogLine {
  // Using timestamp for ns precision without overflow
  google.protobuf.Timestamp timestamp = 1;
  LogStream stream = 2;
  string text = 3;
  bool truncated = 4;
}

message ContainerLogsChunk {
  string request_id = 1;
  repeated LogLine lines = 2;
  int64 dropped_lines = 3;
}

message ContainerStatsSample {
  string request_id = 1;
  int64 timestamp_ms = 2;
  // Relative to one core, can exceed 100.
  double cpu_percent = 3;
  uint64 mem_usage_bytes = 4;
  // Host memory when the container has no limit.
  uint64 mem_limit_bytes = 5;
  // Cumulative counters.
  uint64 net_rx_bytes = 6;
  uint64 net_tx_bytes = 7;
  uint64 pids = 8;
  uint32 online_cpus = 9;
}

enum StreamEndReason {
  STREAM_END_REASON_UNSPECIFIED = 0;
  STREAM_END_REASON_COMPLETED = 1;
  STREAM_END_REASON_CANCELLED = 2;
  STREAM_END_REASON_CONTAINER_GONE = 3;
  STREAM_END_REASON_LEASE_EXPIRED = 4;
  STREAM_END_REASON_LIMIT = 5;
  STREAM_END_REASON_ERROR = 6;
  STREAM_END_REASON_NOT_FOUND = 7;
}

message StreamEnd {
  string request_id = 1;
  StreamEndReason reason = 2;
  string error_message = 3;
}
