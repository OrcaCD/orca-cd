services:
  hub:
    image: ghcr.io/orcacd/hub:latest # Replace with your actual image version tag
    container_name: orca-hub
    restart: unless-stopped
    env_file: .env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data/hub:/app/data

  agent:
    image: ghcr.io/orcacd/agent:latest # Replace with your actual image version tag
    container_name: orca-agent
    restart: unless-stopped
    # Only the agent's settings are passed from .env: it also holds the hub's APP_SECRET,
    # which compose files deployed by the agent must not be able to read.
    environment:
      - HUB_URL
      - AUTH_TOKEN
      - CA_CERT_FILE
      - DEPLOYMENTS_DIR
      - ALLOWED_PRIVILEGED_APPS
      - RESTRICT_VOLUMES_TO_DEPLOYMENTS_DIR
      - HEALTHCHECK_PORT
      - LOG_LEVEL
      - LOG_JSON
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    use_api_socket: true # Allows container to access Docker API on host
    volumes:
      - ./deployments:/deployments
    depends_on: # Remove this if you are only deploying the agent on a host without the hub
      hub:
        condition: service_healthy
