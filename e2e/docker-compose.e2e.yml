services:
  hub:
    build:
      context: ..
      dockerfile: hub.Dockerfile
    container_name: orca-hub-e2e-test
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      - APP_URL=http://127.0.0.1:8090
      - APP_SECRET=supersecretkey_minimum_32_characters

  agent:
    image: orca-agent-e2e-test
    build:
      context: ..
      dockerfile: agent.Dockerfile
    profiles:
      - agent
    container_name: orca-agent-e2e-test
    use_api_socket: true
    volumes:
      - ./data/agent/deployments:/deployments
    environment:
      - HUB_URL=${AGENT_HUB_URL:-}
      - AUTH_TOKEN=${AGENT_AUTH_TOKEN:-}
